# Agent Gateway Configuration (YAML)
# This file is optional - environment variables take precedence
# Reference: https://github.com/...

# Data Classification Patterns
data_classification:
  # RED patterns - sensitive data, never sent to cloud
  red_patterns:
    - name: CPF
      pattern: '(?<!\d)(?:\d{3}\.\d{3}\.\d{3}-\d{2}|\d{11})(?!\d)'
    - name: Bank Account
      pattern: '\b(?:ag[eê]ncia|conta corrente|conta|d[ií]gito|banco|bank account|account number)\b'
    - name: Tax Records
      pattern: '\b(?:IRPF|informe de rendimentos|imposto de renda|receitanet|Gov\.br)\b'
    - name: Financial Transaction
      pattern: '\b(?:transfer[eê]ncia|d[eé]bito|cr[eé]dito|extrato|saldo|boleto|pix)\b'
    - name: CNPJ
      pattern: '(?<!\d)\d{2}\.\d{3}\.\d{3}/\d{4}-\d{2}(?!\d)'
    - name: RG
      pattern: '\bRG\s*:?'
    - name: Credentials
      pattern: '\b(?:minha|meu|my)\s+(?:senha|c[oó]digo|pin(?:code)?|token)(?:\s+\w+){0,3}\s+(?:[eé]|is|:|=)\s*\S+'
    - name: Identity Data
      pattern: '\b(?:CPF|CNPJ|SSN|social security)\b'
    - name: Payment Card
      pattern: '\b(?:credit card|visa|mastercard)\b'
  
  # YELLOW patterns - requires approval before cloud transmission
  yellow_patterns:
    - name: Private Code
      pattern: '\b(?:reposit[oó]rio privado|source code|proprietary|private)\b'
    - name: Confidential
      pattern: '\b(?:confidential|confidencial|internal|for internal use only|business secret|secret)\b'

# Server Configuration
server:
  environment: development
  host: 0.0.0.0
  port: 8000
  log_level: INFO

# Database Configuration
database:
  path: /data/ai-platform/gateway.db
  pool_size: 5
  max_overflow: 10

# Authentication
auth:
  jwt_expiry_minutes: 15
  refresh_token_expiry_days: 7
  password_min_length: 8

# Ollama Configuration
ollama:
  base_url: http://ollama:11434
  timeout_seconds: 30
  max_retries: 3

audit_logging:
  retention_days: 90
  archive_path: /data/ai-platform/backups/audit-logs

# Model Tiers (reference, overridden by database ModelConfig table)
models:
  default_tier: default
  tiers:
    default:
      models:
        - qwen3.5:2b
      timeout_seconds: 120
    heavier:
      models:
        - qwen3.5:4b
      timeout_seconds: 180
    batch:
      models:
        - qwen3.5:9b
      timeout_seconds: 600
    cloud:
      models:
        - claude-code
      timeout_seconds: 120
